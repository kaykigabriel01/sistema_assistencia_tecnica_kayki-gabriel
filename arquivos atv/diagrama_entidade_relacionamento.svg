<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#f4f7fb"/>
<style>.box{fill:white;stroke:#17365d;stroke-width:2;rx:12}.head{fill:#17365d}.ht{font: bold 20px Arial;fill:white}.t{font:15px Arial;fill:#172033}.line{stroke:#198b83;stroke-width:3;fill:none}.rel{font:14px Arial;fill:#198b83;font-weight:bold}</style>
<rect class="box" x="60" y="60" width="260" height="180"/><rect class="head" x="60" y="60" width="260" height="42" rx="10"/><text class="ht" x="82" y="88">usuarios</text>
<text class="t" x="82" y="130">PK id</text><text class="t" x="82" y="158">nome, email (UNIQUE)</text><text class="t" x="82" y="186">senha_hash</text><text class="t" x="82" y="214">criado_em</text>
<rect class="box" x="410" y="60" width="300" height="220"/><rect class="head" x="410" y="60" width="300" height="42" rx="10"/><text class="ht" x="432" y="88">clientes</text>
<text class="t" x="432" y="130">PK id</text><text class="t" x="432" y="158">nome, cpf_criptografado</text><text class="t" x="432" y="186">telefone, email</text><text class="t" x="432" y="214">criado_em</text>
<rect class="box" x="410" y="380" width="300" height="220"/><rect class="head" x="410" y="380" width="300" height="42" rx="10"/><text class="ht" x="432" y="408">equipamentos</text>
<text class="t" x="432" y="450">PK id</text><text class="t" x="432" y="478">FK cliente_id → clientes.id</text><text class="t" x="432" y="506">tipo, marca, modelo</text><text class="t" x="432" y="534">numero_serie</text><text class="t" x="432" y="562">defeito_relatado, criado_em</text>
<rect class="box" x="790" y="380" width="260" height="220"/><rect class="head" x="790" y="380" width="260" height="42" rx="10"/><text class="ht" x="812" y="408">ordens_servico</text>
<text class="t" x="812" y="450">PK id</text><text class="t" x="812" y="478">FK equipamento_id</text><text class="t" x="812" y="506">descricao_servico, status</text><text class="t" x="812" y="534">valor, data_abertura</text><text class="t" x="812" y="562">data_conclusao</text>
<path class="line" d="M560 280 L560 380"/><text class="rel" x="572" y="333">1 : N</text>
<path class="line" d="M710 490 L790 490"/><text class="rel" x="724" y="475">1 : N</text>
<text class="t" x="60" y="610">PK = chave primária · FK = chave estrangeira</text>
</svg>